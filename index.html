<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>watch-admin-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; font-size: 14px;"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.getElementById('error-log').innerText += event.error?.stack || event.message + '\n';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.getElementById('error-log').innerText += 'Unhandled Promise Rejection: ' + (event.reason?.stack || event.reason) + '\n';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
